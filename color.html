<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analogplotter Color</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js" integrity="sha384-Emf5ZVIUiarAdhkgtqK+5/Z5qIvM6QoVrS+qAVtfyZVuD5lIHrac0me485+Antp0" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg: #ffffff;
            --panel: #f5f5f7;
            --line: #e3e3e8;
            --text: #1d1d1f;
            --text-muted: #6e6e73;
            --accent: #0066cc;
            --accent-hover: #0055b3;
            --ch-r: #d70015;
            --ch-g: #248a3d;
            --ch-b: #0066cc;
            --warn: #b25000;
            --warn-bg: #fff4e5;
            --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, 'SF Mono', 'Menlo', monospace;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.45; }
        button, input, select, textarea { font: inherit; color: inherit; }

        .topbar {
            position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
            height: 60px; padding: 0 24px; background: rgba(255, 255, 255, 0.86);
            backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--line);
        }
        .wordmark { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
        .wordmark span { color: var(--text-muted); font-weight: 400; }
        .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--panel); color: var(--text-muted); }
        .topbar .spacer { flex: 1; }
        .topbar a { color: var(--accent); text-decoration: none; font-size: 13px; }
        .topbar a:hover { text-decoration: underline; }
        @media (max-width: 600px) {
            .topbar { padding: 0 12px; gap: 8px; }
            .topbar .badge { display: none; }
            .topbar .seg button { padding: 5px 10px; }
            .topbar a { font-size: 12px; }
        }

        .layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 24px; padding: 24px; max-width: 1680px; margin: 0 auto; }
        @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; padding: 16px; } }
        .sidebar { display: grid; gap: 14px; align-content: start; min-width: 0; }
        .main { display: grid; gap: 20px; align-content: start; min-width: 0; }

        details.section { background: var(--panel); border-radius: 16px; padding: 4px 16px; }
        details.section > summary {
            list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
            padding: 12px 0; font-weight: 600; font-size: 14px;
        }
        details.section > summary::-webkit-details-marker { display: none; }
        details.section > summary::after {
            content: ''; margin-left: auto; width: 8px; height: 8px; border-right: 1.6px solid var(--text-muted);
            border-bottom: 1.6px solid var(--text-muted); transform: rotate(-45deg); transition: transform .15s;
        }
        details.section[open] > summary::after { transform: rotate(45deg); }
        .sec-body { display: grid; gap: 12px; padding: 4px 0 16px; }
        .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
        label.f { display: flex; flex-wrap: wrap; align-items: center; row-gap: 4px; font-size: 12px; color: var(--text-muted); font-weight: 500; }
        label.f > input, label.f > textarea, label.f > select { flex: 1 1 100%; }
        input[type=text], input[type=number], select, textarea {
            width: 100%; padding: 8px 10px; border: 1px solid #d2d2d7; border-radius: 10px; background: #fff; font-size: 13px;
        }
        textarea { font-family: var(--font-mono); font-size: 12px; resize: vertical; min-height: 54px; }
        input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 1px;
        }
        .ch { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text); }
        .ch::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .ch.r { color: var(--ch-r); } .ch.g { color: var(--ch-g); } .ch.b { color: var(--ch-b); }
        .hint { font-size: 12px; color: var(--text-muted); }
        .seg { display: inline-flex; background: #e8e8ed; border-radius: 999px; padding: 2px; }
        .seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; font-size: 12px; cursor: pointer; }
        .seg button[aria-pressed=true] { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
        .btns { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn { border: 0; border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; background: #e8e8ed; }
        .btn:hover { background: #dcdce1; }
        .btn.primary { background: var(--accent); color: #fff; }
        .btn.primary:hover { background: var(--accent-hover); }
        .file-label { display: inline-flex; }

        .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
        @media (max-width: 1300px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .tile { background: var(--panel); border-radius: 16px; padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
        .tile .v { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
        .tile .k { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; }
        .tile .s { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

        .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
        .card { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 10px; min-width: 0; }
        .card h3 { margin: 0 0 2px; font-size: 14px; display: flex; align-items: center; }
        .card p.sub { margin: 0 0 8px; font-size: 12px; color: var(--text-muted); }
        .chart-box { position: relative; height: 300px; }

        .quad-card { border: 0; padding: 0; position: relative; }
                .quad-box { position: relative; width: 100%; max-width: min(100%, calc(100vh - 110px)); margin: 0 auto; aspect-ratio: 1 / 1; }
        details.more { border-top: 1px solid var(--line); padding-top: 4px; }
        details.more > summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 10px 0; color: var(--text-muted); }
        .more-body { display: grid; gap: 20px; padding-top: 8px; }
        .quad-box canvas { width: 100%; height: 100%; display: block; }
        .warnings { display: grid; gap: 6px; }
        .warnings:empty { display: none; }
        .warn { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 8px 12px; font-size: 13px; }

        .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; }
        table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
        th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
        th { font-size: 11.5px; color: var(--text-muted); font-weight: 600; background: var(--panel); }
        th:first-child, td:first-child { text-align: left; }
        tbody tr:last-child td { border-bottom: 0; }
        td { font-family: var(--font-mono); font-size: 12px; }
        td:first-child { font-family: var(--font-sans); font-size: 12.5px; }
        tr.grey td { background: #f8f8fa; font-weight: 600; }
        td.r { color: var(--ch-r); } td.g { color: var(--ch-g); } td.b { color: var(--ch-b); }
        td em { color: var(--warn); font-style: normal; }
        th.grp { text-align: center; border-left: 1px solid var(--line); }
        td.sep, th.sep { border-left: 1px solid var(--line); }
        h2.h { font-size: 15px; margin: 4px 0 0; display: flex; align-items: center; }

        /* Info tips (same pattern as the B&W tool) */
        .info-tip {
            display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
            width: 15px; height: 15px; margin-left: 5px; border-radius: 50%;
            border: 1px solid #c7c7cc; background: #fff; color: #6e6e73;
            font: 600 10px/1 var(--font-sans); cursor: help; user-select: none; text-transform: none;
        }
        .info-tip::before { content: 'i'; }
        .info-tip:hover, .info-tip:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
        .info-tip > .info-body { display: none !important; }
        #infoPop {
            position: fixed; z-index: 1000; max-width: min(340px, calc(100vw - 24px)); padding: 10px 12px;
            background: #fff; color: var(--text); border: 1px solid #e5e5ea; border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0,0,0,.14); font-size: 12px; line-height: 1.5; pointer-events: none;
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="wordmark">Analog<span>plotter</span></div>
        <span class="badge">Color · cine lab</span>
        <div class="spacer"></div>
        <div class="seg" role="group" aria-label="Traces shown in the diagram">
            <button type="button" data-trace="all" aria-pressed="true">All</button>
            <button type="button" data-trace="R" aria-pressed="false">R</button>
            <button type="button" data-trace="G" aria-pressed="false">G</button>
            <button type="button" data-trace="B" aria-pressed="false">B</button>
        </div>
        <div class="spacer"></div>
        <a href="index.html">Black &amp; white tool</a>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <details class="section" open>
                <summary>Scene &amp; camera</summary>
                <div class="sec-body">
                    <div class="row">
                        <label class="f">Scene range (log)<span class="tip" data-tip="Log luminance range from the scene's darkest detail to diffuse white (90% reflectance). 2.20 (7.3 stops) is the normal scene of the B&amp;W tool."></span>
                            <input type="number" id="sceneRange" step="0.05" min="0.5" max="4" value="2.20"></label>
                        <label class="f">Camera flare (log at shadow)<span class="tip" data-tip="How much camera flare lifts the scene shadow, in log H. Flare is a constant amount of light added everywhere, so it lifts shadows strongly and leaves highlights almost unchanged. 0.40 is the usual still-camera normal; good cine primes often sit lower."></span>
                            <input type="number" id="camFlare" step="0.05" min="0" max="1.5" value="0.40"></label>
                    </div>
                    <div class="row">
                        <label class="f">Exposure (stops vs. normal)<span class="tip" data-tip="Over- or underexposure of the camera negative relative to normal exposure at the film's speed."></span>
                            <input type="number" id="expStops" step="0.333" min="-5" max="5" value="0"></label>
                        <label class="f" id="greyOffsetWrap">Grey above speed point (log)<span class="tip" data-tip="Where an 18% grey card lands above the ISO 5800 speed point at normal exposure. 0.76 comes from a reflected-light meter with K = 12.5 and lens factor q = 0.65 (H = qK/S ≈ 8.1/S) against the ISO 5800 speed point Hm = √2/S."></span>
                            <input type="number" id="greyOffset" step="0.01" min="0" max="2" value="0.76"></label>
                        <label class="f" id="greyAbsWrap">18% grey at log H (lux·s)<span class="tip" data-tip="Exposure of an 18% grey card at normal exposure, in log lux·s. Kodak's VISION3 250D datasheet puts normal exposure (camera stop 0) at −1.30. A reflected-light meter set to the film's EI gives log(8.1 / EI): −1.49 at EI 250."></span>
                            <input type="number" id="greyAbs" step="0.01" min="-6" max="3" value="-1.30"></label>
                    </div>
                </div>
            </details>

            <details class="section" open>
                <summary>Camera negative</summary>
                <div class="sec-body">
                    <label class="f">Preset<select id="negPreset"><option value="">Own measurement</option><option value="v3_250d">Kodak VISION3 250D 5207 · datasheet</option></select></label>
                    <label class="f">Film / process<input type="text" id="negName" value=""></label>
                    <div class="row">
                        <label class="f">Exposure axis<span class="tip" data-tip="Relative steps: readings from a step tablet with a fixed log H increment. log lux·s or lux·s: absolute exposure for every reading, as on a datasheet or from a calibrated sensitometer. Absolute exposure gives the real ISO 5800 speed and places the grey in lux·s."></span>
                            <select id="negUnit"><option value="step">Relative steps</option><option value="log">log lux·s</option><option value="luxs">lux·s</option></select></label>
                        <label class="f" id="negStepWrap">log H step<span class="tip" data-tip="Exposure increment between the readings, in log H. 0.15 for a standard 21-step tablet."></span>
                            <input type="number" id="negStep" step="0.01" min="0.01" value="0.15"></label>
                    </div>
                    <label class="f" id="negLogHWrap">Exposure per reading<textarea id="negLogH" rows="2" placeholder="One value per density reading"></textarea></label>
                    <label class="f"><span class="ch r">Red · Status M</span><textarea id="negR" rows="2"></textarea></label>
                    <label class="f"><span class="ch g">Green · Status M</span><textarea id="negG" rows="2"></textarea></label>
                    <label class="f"><span class="ch b">Blue · Status M</span><textarea id="negB" rows="2"></textarea></label>
                </div>
            </details>

            <details class="section" open>
                <summary>Printer</summary>
                <div class="sec-body">
                    <div class="seg" role="group" aria-label="Printer type">
                        <button type="button" data-printer="contact" aria-pressed="true">Contact</button>
                        <button type="button" data-printer="optical" aria-pressed="false">Optical</button>
                    </div>
                    <div class="row3">
                        <label class="f"><span class="ch r">Red light</span><input type="number" id="lightR" step="1" value="25"></label>
                        <label class="f"><span class="ch g">Green light</span><input type="number" id="lightG" step="1" value="25"></label>
                        <label class="f"><span class="ch b">Blue light</span><input type="number" id="lightB" step="1" value="25"></label>
                    </div>
                    <div class="row">
                        <label class="f">Point size (log E)<span class="tip" data-tip="Exposure change per printer point. 0.025 log E (1/12 stop) is the common lab scale."></span>
                            <input type="number" id="pointSize" step="0.001" min="0.005" value="0.025"></label>
                        <label class="f">Printer flare (%)<span class="tip" data-tip="Stray light in the printer as a percentage of the exposure the grey receives. It lifts the print's highlights (thin negative areas get extra light) and lowers contrast there. Contact printing has almost none; optical printers add lens flare."></span>
                            <input type="number" id="printerFlare" step="0.1" min="0" max="20" value="0"></label>
                    </div>
                    <label class="f">Grey aim on print (Status A)<span class="tip" data-tip="Print density the 18% grey should reach, per channel. 1.00 neutral is a starting point; use your lab's aim (e.g. the LAD values for your print stock)."></span></label>
                    <div class="row3">
                        <label class="f"><span class="ch r">Red</span><input type="number" id="aimR" step="0.01" value="1.00"></label>
                        <label class="f"><span class="ch g">Green</span><input type="number" id="aimG" step="0.01" value="1.00"></label>
                        <label class="f"><span class="ch b">Blue</span><input type="number" id="aimB" step="0.01" value="1.00"></label>
                    </div>
                    <label class="f" id="transferWrap">Optical transfer curve (optional)<span class="tip" data-tip="How the optical system maps exposure in to exposure out, as pairs of relative log E: 'in out' per pair, separated by semicolons or new lines, e.g. 0 0; 1 0.95; 2 1.9. Leave empty for a straight 1:1 transfer. Applied after printer flare."></span>
                        <textarea id="transfer" rows="2" placeholder="e.g. 0 0; 1 0.95; 2 1.9"></textarea></label>
                </div>
            </details>

            <details class="section" open>
                <summary>Print film</summary>
                <div class="sec-body">
                    <label class="f">Preset<select id="prtPreset"><option value="">Own measurement</option><option value="k2383">Kodak VISION 2383 · datasheet</option></select></label>
                    <label class="f">Film / process<input type="text" id="prtName" value=""></label>
                    <div class="row">
                        <label class="f">Exposure axis<select id="prtUnit"><option value="step">Relative steps</option><option value="log">log lux·s</option><option value="luxs">lux·s</option></select></label>
                        <label class="f" id="prtStepWrap">log E step<input type="number" id="prtStep" step="0.01" min="0.01" value="0.15"></label>
                    </div>
                    <label class="f" id="prtLogEWrap">Exposure per reading<textarea id="prtLogE" rows="2" placeholder="One value per density reading"></textarea></label>
                    <label class="f"><span class="ch r">Red · Status A</span><textarea id="prtR" rows="2"></textarea></label>
                    <label class="f"><span class="ch g">Green · Status A</span><textarea id="prtG" rows="2"></textarea></label>
                    <label class="f"><span class="ch b">Blue · Status A</span><textarea id="prtB" rows="2"></textarea></label>
                </div>
            </details>

            <details class="section" open>
                <summary>Projection</summary>
                <div class="sec-body">
                    <div class="row">
                        <label class="f">Open gate (cd/m²)<span class="tip" data-tip="Screen luminance with no film in the gate. 48 cd/m² (14 fL) is the usual cinema reference for an open gate."></span>
                            <input type="number" id="openGate" step="1" min="1" value="48"></label>
                        <label class="f">Room light (% of open gate)<span class="tip" data-tip="Light that reaches the screen regardless of the image: exit signs, aisle lights, port glass and reflections from the room. A constant floor that sets the deepest black the screen can show. 0.2% alone limits the screen to 500:1."></span>
                            <input type="number" id="stray" step="0.05" min="0" max="10" value="0.20"></label>
                    </div>
                    <label class="f">Projector lens flare (% of grey)<span class="tip" data-tip="Veiling glare of the projection lens: light scattered from the whole image across the screen. It scales with the picture itself, so it is taken as a percentage of the 18% grey's screen luminance in each channel. It lifts the blacks of a normal scene; a dark scene gets less."></span>
                        <input type="number" id="projFlare" step="0.1" min="0" max="20" value="1.0"></label>
                    <label class="f">Lamp balance (relative output per channel)<span class="tip" data-tip="Relative light the projector lamp and screen deliver in the red, green and blue bands, green = 1. A warmer lamp has red above 1 and blue below 1."></span></label>
                    <div class="row3">
                        <label class="f"><span class="ch r">Red</span><input type="number" id="lampR" step="0.01" min="0.1" value="1.00"></label>
                        <label class="f"><span class="ch g">Green</span><input type="number" id="lampG" step="0.01" min="0.1" value="1.00"></label>
                        <label class="f"><span class="ch b">Blue</span><input type="number" id="lampB" step="0.01" min="0.1" value="1.00"></label>
                    </div>
                </div>
            </details>

            <details class="section" open>
                <summary>Data</summary>
                <div class="sec-body">
                    <div class="btns">
                        <button type="button" class="btn primary" id="exportBtn">Export JSON</button>
                        <label class="btn file-label" for="importFile">Import JSON</label>
                        <input type="file" id="importFile" accept=".json,application/json" hidden>
                        <button type="button" class="btn" id="exampleBtn">Load Kodak example</button>
                    </div>
                </div>
            </details>
        </aside>

        <main class="main">
            <div class="warnings" id="warnings"></div>
            <div class="card quad-card">
                <div class="quad-box"><canvas id="quad" role="img" aria-label="Six-stage tone transfer diagram for red, green and blue, from scene to screen"></canvas></div>
            </div>
            <details class="more">
                <summary>Details</summary>
                <div class="more-body">
            <div class="tiles" id="tiles"></div>
            <div class="charts">
                <div class="card">
                    <h3>Camera film<span class="tip" data-tip="The negative's three curves. Dots mark where the scene shadow, the 18% grey and diffuse white land on each layer."></span></h3>
                    <div class="chart-box"><canvas id="chNeg"></canvas></div>
                </div>
                <div class="card">
                    <h3>Print film<span class="tip" data-tip="The print film's three curves on its own relative log E axis. Dots mark where shadow, grey and white of the scene land after the printer, timing and printer flare."></span></h3>
                    <div class="chart-box"><canvas id="chPrt"></canvas></div>
                </div>
                <div class="card">
                    <h3>Scene → screen<span class="tip" data-tip="Screen luminance per channel against scene luminance, both in log units with 0 at the 18% grey. The dashed lines are references through the grey: slope 1.0 is an exact copy of the scene's contrast; slope 1.5 is the higher overall contrast usually preferred for projection in a dark room (Hunt, The Reproduction of Colour)."></span></h3>
                    <div class="chart-box"><canvas id="chRep"></canvas></div>
                </div>
                <div class="card">
                    <h3>Neutral balance<span class="tip" data-tip="Red and blue against green on the screen along the grey scale, as a density difference (0.01 ≈ 2.3% in light; positive = more of that colour), measured from the grey aim, which counts as neutral. Lines on 0 mean a neutral grey scale. A line shifted up or down everywhere is a colour cast from timing or lamp. Lines that tilt or bend are a colour crossover, for example warm shadows and cool highlights, which timing cannot correct."></span></h3>
                    <div class="chart-box"><canvas id="chBal"></canvas></div>
                </div>
            </div>
            <h2 class="h">Tone by tone<span class="tip" data-tip="Each row is one scene tone, in stops from the 18% grey. Values marked in orange lie beyond the measured part of a curve and are held at the last reading."></span></h2>
            <div class="tbl-wrap"><table id="table"></table></div>
                </div>
            </details>
        </main>
    </div>

<script>
'use strict';

// ---------------------------------------------------------------------------
// Presets digitised from Kodak's published datasheets (curve pages traced at
// 400 dpi, about ±0.02 D and ±0.02 log). Representative of production coatings
// under Kodak's test conditions, not of a particular roll or process line.
//   VISION3 250D 5207: KODAK publication, sensitometric curves, 5500 K daylight
//     1/50 s, ECN-2, Status M. Normal exposure (camera stop 0) at log H −1.30.
//   VISION Color Print Film 2383: H-1-2383 (3-22), 1/500 s tungsten + heat
//     absorbing glass, ECP-2D, Status A. Toe and shoulder (above D 4.0) are read
//     more coarsely where the three curves run together.
//   LAD aim for 2383: Status A 1.09 / 1.06 / 1.03 (KODAK H-61b).
// ---------------------------------------------------------------------------
const PRESETS = {
    neg: {
        v3_250d: {
            negName: 'Kodak VISION3 250D 5207 · ECN-2 · datasheet', negUnit: 'log', negStep: '0.1',

const EXAMPLE = {
    ...PRESETS.neg.v3_250d, ...PRESETS.prt.k2383,
    sceneRange: '2.20', camFlare: '0.40', expStops: '0', greyOffset: '0.76',
    printer: 'contact', lightR: '25', lightG: '25', lightB: '25', pointSize: '0.025', printerFlare: '0', transfer: '',
    openGate: '48', stray: '0.20', projFlare: '1.0', lampR: '1.00', lampG: '1.00', lampB: '1.00'
};
const FIELDS = Object.keys(EXAMPLE).filter(k => k !== 'printer');
const ABSOLUTE = (unit) => unit === 'log' || unit === 'luxs';
const STORAGE_KEY = 'analogplotter_color_state';
const CH = ['R', 'G', 'B'];
const CH_COLOR = { R: '#d70015', G: '#248a3d', B: '#0066cc' };
const CH_NAME = { R: 'Red', G: 'Green', B: 'Blue' };
const GREY_REFLECTANCE = 0.18, WHITE_REFLECTANCE = 0.90;
const LOG_WHITE = Math.log10(WHITE_REFLECTANCE / GREY_REFLECTANCE); // +0.70 above grey

const $ = (id) => document.getElementById(id);
let printerType = 'contact';

// --- parsing -----------------------------------------------------------------
// "0.24, 0.26 …" or "0,24; 0,26 …" (decimal commas when the list uses semicolons)
const parseList = (text) => {
    const t = String(text || '').trim();
    if (!t) return [];
    const parts = t.includes(';') ? t.split(/[;\n]+/).map(s => s.trim().replace(',', '.')) : t.split(/[\s,]+/);
    return parts.filter(Boolean).map(Number).filter(Number.isFinite);
};
// Optical transfer pairs "in out; in out"
const parsePairs = (text) => String(text || '').split(/[;\n]+/).map(s => s.trim()).filter(Boolean)
    .map(s => s.replace(/,(?=\d)/g, '.').split(/[\s,]+/).map(Number)).filter(p => p.length >= 2 && p.every(Number.isFinite))
    .map(([x, y]) => ({ x, y })).sort((a, b) => a.x - b.x);

// --- curves ----------------------------------------------------------------
// Monotone cubic (Fritsch–Carlson) through sorted points; outside the data the
// value is held at the end point and the read is flagged.
const makeCurve = (xs, ys) => {
    const pts = xs.map((x, i) => ({ x, y: ys[i] })).filter(p => Number.isFinite(p.x) && Number.isFinite(p.y))
        .sort((a, b) => a.x - b.x);
    const n = pts.length;
    if (n < 2) return null;
    const d = [], m = new Array(n);
    for (let i = 0; i < n - 1; i++) d.push((pts[i + 1].y - pts[i].y) / ((pts[i + 1].x - pts[i].x) || 1e-9));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
        if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
        const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
        if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
    }
    const at = (x) => {
        if (x <= pts[0].x) return { y: pts[0].y, out: x < pts[0].x - 1e-9 };
        if (x >= pts[n - 1].x) return { y: pts[n - 1].y, out: x > pts[n - 1].x + 1e-9 };
        let i = 0;
        while (i < n - 2 && x > pts[i + 1].x) i++;
        const h = pts[i + 1].x - pts[i].x, t = (x - pts[i].x) / h;
        const h00 = 2 * t ** 3 - 3 * t ** 2 + 1, h10 = t ** 3 - 2 * t ** 2 + t, h01 = -2 * t ** 3 + 3 * t ** 2, h11 = t ** 3 - t ** 2;
        return { y: h00 * pts[i].y + h10 * h * m[i] + h01 * pts[i + 1].y + h11 * h * m[i + 1], out: false };
    };
    // x for a given y on a rising curve (bisection); null when y is outside the curve's range
    const inverse = (y) => {
        const lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y));
        if (y < lo || y > hi) return null;
        let a = pts[0].x, b = pts[n - 1].x;
        for (let k = 0; k < 60; k++) { const c = (a + b) / 2; if (at(c).y < y) a = c; else b = c; }
        return (a + b) / 2;
    };
    return { pts, at, inverse, xMin: pts[0].x, xMax: pts[n - 1].x, yMin: Math.min(...pts.map(p => p.y)) };
};

// Exposure for each reading: fixed relative steps, or absolute values in log lux·s or lux·s
const axisValues = (unit, custom, step, count) => {
    if (unit === 'log') return parseList(custom);
    if (unit === 'luxs') return parseList(custom).map(v => v > 0 ? Math.log10(v) : NaN);
    return Array.from({ length: count }, (_, i) => +(i * step).toFixed(6));
};

// --- state -----------------------------------------------------------------
const readState = () => {
    const s = { printer: printerType };
    FIELDS.forEach(k => { s[k] = $(k).value; });
    return s;
};
// Show the step or the value field to match each film's exposure axis, and the
// grey placement that fits it (absolute log H or above the speed point)
const syncUnits = () => {
    for (const [unit, step, vals] of [['negUnit', 'negStepWrap', 'negLogHWrap'], ['prtUnit', 'prtStepWrap', 'prtLogEWrap']]) {
        const abs = ABSOLUTE($(unit).value);
        $(step).hidden = abs; $(vals).hidden = !abs;
    }
    const absNeg = ABSOLUTE($('negUnit').value);
    $('greyOffsetWrap').hidden = absNeg; $('greyAbsWrap').hidden = !absNeg;
};
// Sessions saved before the exposure-axis switch: custom values meant a list, otherwise steps
const migrate = (d) => {
    const out = { ...d };
    if (out.negUnit === undefined) out.negUnit = parseList(out.negLogH).length ? 'log' : 'step';
    if (out.prtUnit === undefined) out.prtUnit = parseList(out.prtLogE).length ? 'log' : 'step';
    return out;
};
const writeState = (s) => {
    FIELDS.forEach(k => { if (s[k] !== undefined) $(k).value = s[k]; });
    if (s.printer !== undefined) setPrinter(s.printer === 'optical' ? 'optical' : 'contact');
    syncUnits();
};
const num = (v, fallback) => { const x = parseFloat(String(v).replace(',', '.')); return Number.isFinite(x) ? x : fallback; };

const setPrinter = (type) => {
    printerType = type;
    document.querySelectorAll('[data-printer]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.printer === type)));
    $('transferWrap').hidden = type !== 'optical';
};

// --- the chain -------------------------------------------------------------
const compute = (s) => {
    const warnings = [];
    const neg = {}, prt = {};
    for (const c of CH) {
        const nd = parseList(s['neg' + c]);
        const nx = axisValues(s.negUnit, s.negLogH, num(s.negStep, 0.15), nd.length);
        if (ABSOLUTE(s.negUnit) && nx.length !== nd.length)
            warnings.push(`Negative ${CH_NAME[c].toLowerCase()}: ${nd.length} densities but ${nx.length} exposure values.`);
        neg[c] = makeCurve(nx.slice(0, nd.length), nd);
        const pd = parseList(s['prt' + c]);
        const px = axisValues(s.prtUnit, s.prtLogE, num(s.prtStep, 0.15), pd.length);
        if (ABSOLUTE(s.prtUnit) && px.length !== pd.length)
            warnings.push(`Print film ${CH_NAME[c].toLowerCase()}: ${pd.length} densities but ${px.length} exposure values.`);
        prt[c] = makeCurve(px.slice(0, pd.length), pd);
    }
    const missing = CH.filter(c => !neg[c]).map(c => 'negative ' + CH_NAME[c].toLowerCase())
        .concat(CH.filter(c => !prt[c]).map(c => 'print ' + CH_NAME[c].toLowerCase()));
    if (missing.length) return { error: `Enter at least two readings for: ${missing.join(', ')}.`, warnings };

    // ISO 5800 speed point: green and the slower of red/blue at 0.15 above each layer's minimum
    const sp = {};
    for (const c of CH) sp[c] = neg[c].inverse(neg[c].yMin + 0.15);
    if (sp.G === null || sp.R === null || sp.B === null) return { error: 'A negative curve never rises 0.15 above its minimum, so the ISO 5800 speed point cannot be found.', warnings };
    const slow = sp.R > sp.B ? 'R' : 'B';
    const logHm = (sp.G + sp[slow]) / 2;

    const range = num(s.sceneRange, 2.2), flareLog = Math.max(0, num(s.camFlare, 0.4));
    const rWhite = LOG_WHITE, rShadow = LOG_WHITE - range;
    const flareRel = Math.pow(10, rShadow) * (Math.pow(10, flareLog) - 1); // flare light, in grey-luminance units
    const absNeg = ABSOLUTE(s.negUnit);
    // ISO 5800: S = √2 / Hm, meaningful only when exposure is in lux·s
    const iso5800 = absNeg ? Math.SQRT2 / Math.pow(10, logHm) : null;
    // 18% grey: absolute log H (datasheet normal or meter) or relative to the speed point
    const logHGrey = (absNeg ? num(s.greyAbs, -1.3) : logHm + num(s.greyOffset, 0.76)) + num(s.expStops, 0) * Math.log10(2);
    const logH = (r) => logHGrey + Math.log10(Math.pow(10, r) + flareRel);

    const p = Math.max(0, num(s.printerFlare, 0)) / 100;
    const transferPairs = printerType === 'optical' ? parsePairs(s.transfer) : [];
    const transfer = transferPairs.length >= 2 ? makeCurve(transferPairs.map(q => q.x), transferPairs.map(q => q.y)) : null;
    const point = num(s.pointSize, 0.025);
    const lights = { R: num(s.lightR, 25), G: num(s.lightG, 25), B: num(s.lightB, 25) };
    const aims = { R: num(s.aimR, 1), G: num(s.aimG, 1), B: num(s.aimB, 1) };
    const open = num(s.openGate, 48), stray = Math.max(0, num(s.stray, 0.2)) / 100;
    const projFlare = Math.max(0, num(s.projFlare, 1)) / 100;
    const lamp = { R: num(s.lampR, 1), G: num(s.lampG, 1), B: num(s.lampB, 1) };

    // Printer: exposure through the negative, plus flare proportional to the grey's exposure
    const ch = {};
    for (const c of CH) {
        const dnGrey = neg[c].at(logH(0)).y;
        const printLogE = (K, dn) => {
            const e = Math.log10(Math.pow(10, K - dn) + p * Math.pow(10, K - dnGrey));
            return transfer ? transfer.at(e).y : e;
        };
        // Balance: printer constant K that prints the grey at its aim with 25-point lights
        let a = -10, b = 15;
        const target = aims[c];
        const f = (K) => prt[c].at(printLogE(K, dnGrey)).y - target;
        let K0 = null;
        if (f(a) <= 0 && f(b) >= 0) {
            for (let k = 0; k < 80; k++) { const m = (a + b) / 2; if (f(m) < 0) a = m; else b = m; }
            K0 = (a + b) / 2;
        }
        if (K0 === null) {
            warnings.push(`${CH_NAME[c]} grey aim ${target.toFixed(2)} lies outside the print film's measured density range.`);
            K0 = prt[c].xMin + dnGrey;
        }
        const K = K0 + point * (lights[c] - 25);
        ch[c] = { K, dnGrey, printLogE: (dn) => printLogE(K, dn) };
        // Projector: light through the print, plus lens flare from the picture (taken at
        // the grey's level) and constant room light
        const dpGrey = prt[c].at(ch[c].printLogE(dnGrey)).y;
        ch[c].screenL = (dp) => open * lamp[c] * (Math.pow(10, -dp) + projFlare * Math.pow(10, -dpGrey) + stray);
    }

    // Run one scene tone through the chain
    const tone = (r) => {
        const out = { r, logH: logH(r), neg: {}, logE: {}, prt: {}, L: {}, logL: {}, beyond: {} };
        for (const c of CH) {
            const n = neg[c].at(out.logH);
            const e = ch[c].printLogE(n.y);
            const d = prt[c].at(e);
            const L = ch[c].screenL(d.y);
            out.neg[c] = n.y; out.logE[c] = e; out.prt[c] = d.y; out.L[c] = L; out.logL[c] = Math.log10(L);
            out.beyond[c] = { neg: n.out, prt: d.out };
        }
        return out;
    };

    const N = 160;
    const samples = Array.from({ length: N + 1 }, (_, i) => tone(rShadow + (rWhite - rShadow) * i / N));
    const grey = tone(0), white = tone(rWhite), shadow = tone(rShadow);

    // Scene-to-screen gamma through the mid-tones: least squares from −2 to +1 stop around grey
    const midGamma = (c) => {
        const pts = samples.filter(t => t.r >= -0.6 && t.r <= 0.3);
        const mx = pts.reduce((s2, t) => s2 + t.r, 0) / pts.length, my = pts.reduce((s2, t) => s2 + t.logL[c], 0) / pts.length;
        const sxy = pts.reduce((s2, t) => s2 + (t.r - mx) * (t.logL[c] - my), 0), sxx = pts.reduce((s2, t) => s2 + (t.r - mx) ** 2, 0);
        return sxy / sxx;
    };
    // Largest red/blue drift from green, relative to their offset at the grey
    let worst = { d: 0, c: 'R', r: 0 };
    for (const t of samples) for (const c of ['R', 'B']) {
        const d = (t.logL[c] - t.logL.G) - (grey.logL[c] - grey.logL.G);
        if (Math.abs(d) > Math.abs(worst.d)) worst = { d, c, r: t.r };
    }

    for (const c of CH) {
        if (shadow.beyond[c].neg || white.beyond[c].neg) warnings.push(`Negative ${CH_NAME[c].toLowerCase()}: the scene runs past the measured strip (${shadow.beyond[c].neg ? 'shadow' : 'white'}). Extend the strip or change exposure.`);
        if (shadow.beyond[c].prt || white.beyond[c].prt) warnings.push(`Print film ${CH_NAME[c].toLowerCase()}: the printed scene runs past the measured strip (${shadow.beyond[c].prt ? 'shadow' : 'white'}).`);
    }

    // Neutral on screen is the grey aim itself (e.g. Kodak's LAD 1.09/1.06/1.03 is a neutral
    // grey of 1.0 visual density), so casts are measured against the aim's own channel offsets
    const cast = (t, c) => (t.logL[c] - t.logL.G) + (aims[c] - aims.G);
    return { cast, absNeg, absPrt: ABSOLUTE(s.prtUnit), iso5800, neg, prt, ch, logH, lamp, flareLog, sp, slow, logHm, logHGrey, range, rShadow, rWhite, samples, grey, white, shadow, open, stray,
             gamma: { R: midGamma('R'), G: midGamma('G'), B: midGamma('B') }, worst, tone, warnings, lights };
};

// --- rendering ---------------------------------------------------------------
const charts = {};
const fmt = (v, d = 2) => Number.isFinite(v) ? v.toFixed(d) : '—';
const sign = (v, d = 2) => { const t = fmt(Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v, d); return t.startsWith('-') ? t : '+' + t; };
const esc = (t) => String(t).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

const baseOptions = (xTitle, yTitle) => ({
    animation: false, responsive: true, maintainAspectRatio: false, parsing: false,
    interaction: { mode: 'nearest', intersect: false },
    plugins: {
        legend: { labels: { boxWidth: 10, boxHeight: 10, font: { size: 11 }, filter: (it) => !it.text.startsWith('_') } },
        tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label.replace(/^_/, '')}: ${fmt(ctx.parsed.x)}, ${fmt(ctx.parsed.y)}` } }
    },
    scales: {
        x: { type: 'linear', title: { display: true, text: xTitle, font: { size: 11 } }, grid: { color: '#eeeef0' }, ticks: { font: { size: 10 } } },
        y: { type: 'linear', title: { display: true, text: yTitle, font: { size: 11 } }, grid: { color: '#eeeef0' }, ticks: { font: { size: 10 } } }
    }
});
const line = (label, data, color, extra = {}) => ({ type: 'line', label, data, borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: 0, tension: 0, ...extra });
const marks = (label, data, color) => ({ type: 'scatter', label, data, borderColor: '#fff', backgroundColor: color, pointRadius: 5, pointBorderWidth: 1.5, pointHoverRadius: 6 });

const drawChart = (id, datasets, options) => {
    if (charts[id]) { charts[id].data.datasets = datasets; charts[id].options = options; charts[id].update('none'); return; }
    charts[id] = new Chart($(id), { type: 'line', data: { datasets }, options });
};

const render = () => {
    syncUnits();
    const s = readState();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
    const res = compute(s);
    $('warnings').innerHTML = (res.error ? [res.error] : res.warnings).map(w => `<div class="warn">${esc(w)}</div>`).join('');
    if (res.error) return;

    const { neg, prt, samples, grey, white, shadow } = res;
    const keyTones = [['shadow', shadow], ['grey', grey], ['white', white]];

    if ($('negInfo')) $('negInfo').textContent = `ISO 5800 speed point at log H ${fmt(res.logHm)} (green and ${CH_NAME[res.slow].toLowerCase()}, the slower layer). 18% grey at log H ${fmt(res.logHGrey)}.`;
    if ($('prtInfo')) $('prtInfo').textContent = `Grey prints at ${CH.map(c => fmt(grey.prt[c])).join(' / ')} (R / G / B). Printer lights ${CH.map(c => res.lights[c]).join('-')}.`;
    if ($('negSub')) $('negSub').textContent = `${s.negName || 'Camera negative'} · density vs. relative log H`;
    if ($('prtSub')) $('prtSub').textContent = `${s.prtName || 'Print film'} · density vs. relative log E`;

    // 1 negative
    drawChart('chNeg', [
        ...CH.map(c => line(CH_NAME[c], neg[c].pts, CH_COLOR[c], { pointRadius: 2 })),
        ...CH.map(c => marks('_' + CH_NAME[c] + ' scene', keyTones.map(([, t]) => ({ x: t.logH, y: t.neg[c] })), CH_COLOR[c]))
    ], baseOptions('Relative log H', 'Density (Status M)'));

    // 2 print film
    drawChart('chPrt', [
        ...CH.map(c => line(CH_NAME[c], prt[c].pts, CH_COLOR[c], { pointRadius: 2 })),
        ...CH.map(c => marks('_' + CH_NAME[c] + ' printed', keyTones.map(([, t]) => ({ x: t.logE[c], y: t.prt[c] })), CH_COLOR[c]))
    ], baseOptions('Relative log E', 'Density (Status A)'));

    // 3 scene → screen, 0 = grey on both axes
    const gy = grey.logL.G;
    const ref = (slope, label, dash) => line(label, [res.rShadow, res.rWhite].map(r => ({ x: r, y: slope * r })), '#8e8e93', { borderWidth: 1, borderDash: dash });
    drawChart('chRep', [
        ...CH.map(c => line(CH_NAME[c], samples.map(t => ({ x: t.r, y: t.logL[c] - gy })), CH_COLOR[c])),
        ref(1, 'Slope 1.0', [2, 3]), ref(1.5, 'Slope 1.5', [6, 4]),
        ...CH.map(c => marks('_' + CH_NAME[c] + ' tones', keyTones.map(([, t]) => ({ x: t.r, y: t.logL[c] - gy })), CH_COLOR[c]))
    ], baseOptions('log scene luminance (0 = 18% grey)', 'log screen luminance (0 = green grey)'));

    // 4 balance relative to green on screen (a timing cast shifts it, a crossover tilts it)
    const bal = (c) => samples.map(t => ({ x: t.r, y: res.cast(t, c) }));
    const balOpts = baseOptions('log scene luminance (0 = 18% grey)', 'Δ density vs. green');
    const span = Math.max(0.1, ...['R', 'B'].flatMap(c => bal(c).map(p => Math.abs(p.y)))) * 1.15;
    balOpts.scales.y.suggestedMin = -span; balOpts.scales.y.suggestedMax = span;
    drawChart('chBal', [
        line('Red − green', bal('R'), CH_COLOR.R), line('Blue − green', bal('B'), CH_COLOR.B),
        line('_neutral', [{ x: res.rShadow, y: 0 }, { x: res.rWhite, y: 0 }], CH_COLOR.G, { borderWidth: 1 })
    ], balOpts);

    // tiles
    const contrast = white.L.G / shadow.L.G;
    const tiles = [
        ['Scene → screen gamma', fmt(res.gamma.G), `R ${fmt(res.gamma.R)} · B ${fmt(res.gamma.B)}`, 'Slope of screen against scene luminance through the mid-tones (−2 to +1 stop around grey), green channel. Around 1.5 is the usual aim for projection in a dark room; 1.0 copies the scene.'],
        ['Grey on screen', `${fmt(grey.L.G, 1)} cd/m²`, `${fmt(100 * grey.L.G / res.open, 1)}% of open gate · cast R ${sign(res.cast(grey, 'R'))} B ${sign(res.cast(grey, 'B'))}`, 'Screen luminance of the 18% grey card, green channel. The cast is red and blue against green on screen, as a density difference, measured from the grey aim: the aim is taken as neutral (Kodak\'s LAD aims are a neutral grey), so 0.00 means the grey looks like the lab\'s neutral.'],
        ['White on screen', `${fmt(white.L.G, 1)} cd/m²`, `${fmt(100 * white.L.G / res.open, 0)}% of open gate`, 'Screen luminance of diffuse white (90% reflectance), green channel.'],
        ['Screen contrast', `${Math.round(contrast)}:1`, `${fmt(Math.log10(contrast) / Math.log10(2), 1)} stops, white to shadow`, 'Diffuse white to the scene shadow on screen, green channel, including stray light.'],
        ['Colour crossover', sign(res.worst.d), `${CH_NAME[res.worst.c].toLowerCase()} vs. green at ${fmt(res.worst.r / Math.log10(2), 1)} stops`, 'Largest change of red or blue against green along the grey scale, measured from their balance at the grey. Timing moves the whole grey scale and cannot remove this part.']
    ];
    if (res.iso5800) tiles.unshift(['ISO 5800 speed', String(Math.round(res.iso5800)), `log Hm ${fmt(res.logHm)} lux·s · ${CH_NAME[res.slow].toLowerCase()} slowest`,
        'Speed of the camera negative by ISO 5800: Hm is the geometric mean of the green exposure and the slower of red and blue, each at 0.15 above its minimum density; S = √2 / Hm. Shown only when the negative has absolute exposure in lux·s. Manufacturers often rate motion-picture films at a lower exposure index than this.']);
    $('tiles').innerHTML = tiles.map(([k, v, sub, tip]) =>
        `<div class="tile"><span class="k">${esc(k)}<span class="tip" data-tip="${esc(tip)}"></span></span><span class="v">${esc(v)}</span><span class="s">${esc(sub)}</span></div>`).join('');

    // table: whole stops from the shadow to white, plus the two ends
    const stop = Math.log10(2);
    const rows = [['Scene shadow', shadow]];
    for (let k = Math.ceil(res.rShadow / stop + 1e-9); k * stop < res.rWhite - 1e-9; k++) rows.push([k === 0 ? '18% grey' : `${k > 0 ? '+' : ''}${k} stops`, res.tone(k * stop)]);
    rows.push(['Diffuse white', white]);
    const cell = (v, c, out, d = 2) => `<td class="${c.toLowerCase()}">${out ? `<em title="Beyond the measured strip">${fmt(v, d)}</em>` : fmt(v, d)}</td>`;
    const head = `<thead><tr><th rowspan="2">Scene tone</th><th rowspan="2">log H</th>
        <th class="grp" colspan="3">Negative (Status M)</th><th class="grp" colspan="3">Print (Status A)</th>
        <th class="grp" colspan="3">Screen (cd/m²)</th><th class="grp" colspan="2">Balance vs. green</th></tr>
        <tr>${['R', 'G', 'B'].map((c, i) => `<th${i === 0 ? ' class="sep"' : ''}>${c}</th>`).join('')}${['R', 'G', 'B'].map((c, i) => `<th${i === 0 ? ' class="sep"' : ''}>${c}</th>`).join('')}${['R', 'G', 'B'].map((c, i) => `<th${i === 0 ? ' class="sep"' : ''}>${c}</th>`).join('')}<th class="sep">R</th><th>B</th></tr></thead>`;
    const body = rows.map(([label, t]) => {
        const bR = res.cast(t, 'R'), bB = res.cast(t, 'B');
        return `<tr${label === '18% grey' ? ' class="grey"' : ''}><td>${esc(label)}</td><td>${fmt(t.logH)}</td>`
            + CH.map(c => cell(t.neg[c], c, t.beyond[c].neg)).join('')
            + CH.map(c => cell(t.prt[c], c, t.beyond[c].prt)).join('')
            + CH.map(c => `<td class="${c.toLowerCase()}">${fmt(t.L[c], t.L[c] < 1 ? 3 : 1)}</td>`).join('')
            + `<td class="r sep">${sign(bR)}</td><td class="b">${sign(bB)}</td></tr>`;
    }).join('');
    $('table').innerHTML = head + `<tbody>${body}</tbody>`;
    // the first group header cells of each block carry the separator line
    $('table').querySelectorAll('tbody tr').forEach(tr => { [2, 5, 8].forEach(i => tr.children[i]?.classList.add('sep')); });
    lastResult = res;
    drawQuadrants(res);
    upgradeTips();
};

// --- six-stage tone transfer diagram -----------------------------------------
// A 3×3 staircase. Panels in a row share the vertical quantity, panels in a column
// share the horizontal one, so a scene tone traces a closed loop through all six:
//     row 0 (log screen L):   Q1 scene→screen   ·              Q6 projector
//     row 1 (log H camera):   Q2 camera flare   Q3 camera film ·
//     row 2 (log E print):    legend            Q4 printer     Q5 print film
//     columns: scene log L (→) | negative density (←) | print density (←)
let lastResult = null;
let traceChannel = 'all';
const drawQuadrants = (res) => {
    const canvas = $('quad');
    const size = Math.max(330, Math.round(canvas.parentElement.getBoundingClientRect().width));
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr; canvas.height = size * dpr;
    const g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, size, size);

    const small = size < 640;
    const mL = small ? 40 : 56, mB = small ? 30 : 40, mT = 8, mR = 8;
    const cw = (size - mL - mR) / 3, chh = (size - mT - mB) / 3, ip = small ? 7 : 10, gap = small ? 6 : 10;
    const { neg, prt, ch, samples } = res;

    // ranges: columns 0 scene r, 1 negative D, 2 print D; rows 0 log screen L, 1 log H, 2 print log E
    const rng = (vals, padv) => { const lo = Math.min(...vals), hi = Math.max(...vals); return [lo - padv, hi + padv]; };
    const colR = [
        [res.rShadow - 0.25, res.rWhite + 0.25],
        rng(CH.flatMap(c => neg[c].pts.map(p => p.y)), 0.08),
        [0, Math.max(...CH.flatMap(c => prt[c].pts.map(p => p.y))) + 0.1]
    ];
    const lScreen = CH.flatMap(c => [Math.log10(ch[c].screenL(colR[2][1])), Math.log10(ch[c].screenL(0))]).concat(samples.flatMap(t => CH.map(c => t.logL[c])));
    const rowR = [
        rng(lScreen, 0.08),
        rng(CH.flatMap(c => [neg[c].xMin, neg[c].xMax]).concat(samples.map(t => t.logH)), 0.05),
        rng(CH.flatMap(c => [prt[c].xMin, prt[c].xMax]).concat(samples.flatMap(t => CH.map(c => t.logE[c]))), 0.05)
    ];
    const left = (col) => mL + col * cw + gap / 2, top = (row) => mT + row * chh + gap / 2;
    // Density columns run right-to-left, so both film curves appear as the familiar
    // characteristic curve turned 90° (exposure up, density to the left), as in the
    // B&W diagram, instead of mirrored across their diagonal.
    const REVERSED = [false, true, true];
    const X = (col, v) => {
        const f = (v - colR[col][0]) / (colR[col][1] - colR[col][0]);
        return left(col) + ip + (REVERSED[col] ? 1 - f : f) * (cw - gap - 2 * ip);
    };
    const Y = (row, v) => top(row) + chh - gap - ip - (v - rowR[row][0]) / (rowR[row][1] - rowR[row][0]) * (chh - gap - 2 * ip);

    const ink = '#1d1d1f', muted = '#8e8e93', gridc = '#eeeef0';
    g.lineJoin = 'round'; g.lineCap = 'round';
    const path = (pts, color, width = 2, dash = []) => {
        g.beginPath(); g.setLineDash(dash); g.strokeStyle = color; g.lineWidth = width;
        pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); g.setLineDash([]);
    };
    const text = (t, x, y, align = 'center', base = 'middle', color = muted, font = '10px') => {
        g.fillStyle = color; g.textAlign = align; g.textBaseline = base;
        g.font = `${font} -apple-system, BlinkMacSystemFont, sans-serif`; g.fillText(t, x, y);
    };
    const niceStep = (span) => [0.1, 0.2, 0.25, 0.5, 1, 2].find(st => span / st <= (small ? 4 : 6)) || 2;
    const ticks = ([a, b]) => { const st = niceStep(b - a), out = []; for (let v = Math.ceil(a / st) * st; v <= b + 1e-9; v += st) out.push(+v.toFixed(3)); return out; };
    const clip = (row, col, fn) => { g.save(); g.beginPath(); g.rect(left(col), top(row), cw - gap, chh - gap); g.clip(); fn(); g.restore(); };

    const PANELS = [
        { id: 'Q1', name: 'Scene → screen', row: 0, col: 0 },
        { id: 'Q6', name: 'Projector flare & optics', row: 0, col: 2 },
        { id: 'Q2', name: 'Camera flare & optics', row: 1, col: 0 },
        { id: 'Q3', name: 'Camera film', row: 1, col: 1 },
        { id: 'Q4', name: 'Printer flare & optics', row: 2, col: 1 },
        { id: 'Q5', name: 'Print film', row: 2, col: 2 }
    ];
    // panel frames and grids
    for (const P of PANELS) {
        g.fillStyle = '#fbfbfd'; g.fillRect(left(P.col), top(P.row), cw - gap, chh - gap);
        clip(P.row, P.col, () => {
            ticks(colR[P.col]).forEach(v => path([[X(P.col, v), top(P.row)], [X(P.col, v), top(P.row) + chh]], gridc, 1));
            ticks(rowR[P.row]).forEach(v => path([[left(P.col), Y(P.row, v)], [left(P.col) + cw, Y(P.row, v)]], gridc, 1));
        });
        g.strokeStyle = '#d2d2d7'; g.lineWidth = 1; g.strokeRect(left(P.col), top(P.row), cw - gap, chh - gap);
    }

    // axis ticks: each column under its lowest panel, each row left of its first panel
    const colBottomRow = [1, 2, 2], rowFirstCol = [0, 0, 1];
    const colTitle = ['scene log L (0 = grey)', 'negative density (M)', 'print density (A)'];
    const rowTitle = ['log screen cd/m²', res.absNeg ? 'log H camera film (lux·s)' : 'log H camera film', res.absPrt ? 'log E print film (lux·s)' : 'log E print film'];
    colR.forEach((r, col) => {
        const yb = top(colBottomRow[col]) + chh - gap;
        ticks(r).forEach(v => text(v.toFixed(1), X(col, v), yb + 9));
        text(colTitle[col], left(col) + (cw - gap) / 2, yb + (small ? 21 : 26), 'center', 'middle', ink, small ? '10px' : '11px');
    });
    rowR.forEach((r, row) => {
        const xl = left(rowFirstCol[row]);
        ticks(r).forEach(v => text(v.toFixed(1), xl - 5, Y(row, v), 'right'));
        g.save(); g.translate(xl - (small ? 30 : 40), top(row) + (chh - gap) / 2); g.rotate(-Math.PI / 2);
        text(rowTitle[row], 0, 0, 'center', 'middle', ink, small ? '10px' : '11px'); g.restore();
    });

    // stop ruler along the bottom of Q2 and the top of Q1's scene axis
    const stop = Math.log10(2);
    for (let k = Math.ceil(colR[0][0] / stop); k * stop <= colR[0][1]; k++) {
        const x = X(0, k * stop), yb = top(1) + chh - gap;
        path([[x, yb - 5], [x, yb]], muted, 1);
    }

    // ----- curves
    const steps = 120;
    const sweep = (a, b, f) => Array.from({ length: steps + 1 }, (_, i) => f(a + (b - a) * i / steps));
    // Q2 camera flare (neutral) and the no-flare reference
    clip(1, 0, () => {
        path(samples.map(t => [X(0, t.r), Y(1, t.logH)]), ink, 2);
        path([colR[0][0], colR[0][1]].map(r => [X(0, r), Y(1, res.logHGrey + r)]), muted, 1, [4, 4]);
    });
    // Q1 references through the green grey: slope 1.0 and 1.5
    const gL = res.grey.logL.G;
    clip(0, 0, () => {
        [[1, [2, 4]], [1.5, [7, 4]]].forEach(([k, dash]) => path(colR[0].map(r => [X(0, r), Y(0, gL + k * r)]), muted, 1, dash));
    });
    for (const c of CH) {
        const col = CH_COLOR[c], nMax = Math.max(...neg[c].pts.map(p => p.y)), pMax = Math.max(...prt[c].pts.map(p => p.y));
        clip(0, 0, () => path(samples.map(t => [X(0, t.r), Y(0, t.logL[c])]), col, 2));                                       // Q1
        clip(1, 1, () => path(sweep(neg[c].xMin, neg[c].xMax, h => [X(1, neg[c].at(h).y), Y(1, h)]), col, 2));                 // Q3
        clip(2, 1, () => path(sweep(neg[c].yMin, nMax, d => [X(1, d), Y(2, ch[c].printLogE(d))]), col, 2));                    // Q4
        clip(2, 2, () => path(sweep(prt[c].xMin, prt[c].xMax, e => [X(2, prt[c].at(e).y), Y(2, e)]), col, 2));                 // Q5
        clip(0, 2, () => path(sweep(0, pMax, d => [X(2, d), Y(0, Math.log10(ch[c].screenL(d)))]), col, 2));                    // Q6
    }
    // room-light floor in Q6 (green)
    if (res.stray > 0) clip(0, 2, () => {
        const y = Y(0, Math.log10(res.open * res.lamp.G * res.stray));
        path([[left(2), y], [left(2) + cw, y]], '#c7c7cc', 1, [3, 3]);
        text('room light', left(2) + cw - gap - 6, y - 7, 'right');
    });

    // ----- traces: shadow, grey, white as closed loops through all six panels
    const tones = [['shadow', res.shadow], ['grey', res.grey], ['white', res.white]];
    const show = traceChannel === 'all' ? CH : [traceChannel];
    for (const c of show) {
        const col = CH_COLOR[c];
        for (const [, t] of tones) {
            const p1 = [X(0, t.r), Y(0, t.logL[c])], p2 = [X(0, t.r), Y(1, t.logH)], p3 = [X(1, t.neg[c]), Y(1, t.logH)],
                  p4 = [X(1, t.neg[c]), Y(2, t.logE[c])], p5 = [X(2, t.prt[c]), Y(2, t.logE[c])], p6 = [X(2, t.prt[c]), Y(0, t.logL[c])];
            g.globalAlpha = traceChannel === 'all' ? 0.5 : 0.85;
            path([p1, p2, p3, p4, p5, p6, p1], col, 1.1, [2, 3]);
            g.globalAlpha = 1;
            [p1, p2, p3, p4, p5, p6].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 3.3, 0, Math.PI * 2); g.fillStyle = col; g.fill(); g.lineWidth = 1.2; g.strokeStyle = '#fff'; g.stroke(); });
        }
    }
    tones.forEach(([name, t]) => text(name, X(0, t.r), Y(1, t.logH) + 13, 'center', 'middle', ink, '600 10px'));

    // panel names (drawn last so traces never cover them)
    for (const P of PANELS) {
        const label = `${P.id} · ${P.name}`;
        g.font = `600 ${small ? 10 : 11}px -apple-system, BlinkMacSystemFont, sans-serif`;
        const w = g.measureText(label).width + 10;
        g.fillStyle = 'rgba(251,251,253,0.92)'; g.fillRect(left(P.col) + 4, top(P.row) + 4, w, small ? 16 : 18);
        text(label, left(P.col) + 9, top(P.row) + (small ? 12 : 13), 'left', 'middle', ink, `600 ${small ? 10 : 11}px`);
    }

    // colour key in the free bottom-left cell
    const lx = left(0) + 4, ly = top(2) + (small ? 30 : 42);
    CH.forEach((c, i) => { const x = lx + i * 56;
        g.fillStyle = CH_COLOR[c]; g.fillRect(x, ly - 5, 12, 10); text(CH_NAME[c], x + 17, ly, 'left', 'middle', ink, '11px'); });
};

document.querySelectorAll('[data-trace]').forEach(b => b.addEventListener('click', () => {
    traceChannel = b.dataset.trace;
    document.querySelectorAll('[data-trace]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    if (lastResult) drawQuadrants(lastResult);
}));
let resizeTimer = null;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (lastResult) drawQuadrants(lastResult); }, 120); });

// --- info tips: <span class="tip" data-tip="…"> becomes an (i) with a popover ----
const upgradeTips = () => {
    document.querySelectorAll('.tip[data-tip]').forEach(el => {
        const t = document.createElement('span');
        t.className = 'info-tip'; t.tabIndex = 0; t.setAttribute('role', 'button'); t.setAttribute('aria-label', 'More information');
        const body = document.createElement('span'); body.className = 'info-body'; body.textContent = el.dataset.tip;
        t.appendChild(body); el.replaceWith(t);
    });
};
(() => {
    let pop = null, current = null;
    const show = (t) => {
        const body = t.querySelector(':scope > .info-body'); if (!body) return;
        if (!pop) { pop = document.createElement('div'); pop.id = 'infoPop'; pop.setAttribute('role', 'tooltip'); document.body.appendChild(pop); }
        pop.textContent = body.textContent; pop.hidden = false; current = t;
        const r = t.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
        pop.style.left = Math.max(12, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 12)) + 'px';
        pop.style.top = Math.max(8, r.bottom + 8 + h > innerHeight - 8 ? r.top - h - 8 : r.bottom + 8) + 'px';
    };
    const hide = () => { if (pop) pop.hidden = true; current = null; };
    document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('.info-tip'); if (t && t !== current) show(t); else if (!t && current && document.activeElement !== current) hide(); });
    document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('.info-tip'); if (t) show(t); else hide(); });
    document.addEventListener('click', e => { const t = e.target.closest && e.target.closest('.info-tip'); if (!t) return; e.preventDefault(); e.stopPropagation(); t.focus(); show(t); }, true);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
    addEventListener('scroll', hide, true);
})();

// --- wiring ----------------------------------------------------------------
let timer = null;
const schedule = () => { clearTimeout(timer); timer = setTimeout(render, 120); };
document.querySelectorAll('.sidebar input, .sidebar textarea, .sidebar select').forEach(el => el.addEventListener('input', schedule));
document.querySelectorAll('[data-printer]').forEach(b => b.addEventListener('click', () => {
    setPrinter(b.dataset.printer);
    // optical printers have lens flare; give it a starting value the first time
    if (b.dataset.printer === 'optical' && num($('printerFlare').value, 0) === 0) $('printerFlare').value = '0.5';
    render();
}));
$('exampleBtn').addEventListener('click', () => { writeState(EXAMPLE); $('negPreset').value = 'v3_250d'; $('prtPreset').value = 'k2383'; render(); });
$('negPreset').addEventListener('change', (e) => { const p = PRESETS.neg[e.target.value]; if (p) { writeState(p); render(); } });
$('prtPreset').addEventListener('change', (e) => { const p = PRESETS.prt[e.target.value]; if (p) { writeState(p); render(); } });
$('exportBtn').addEventListener('click', () => {
    const s = readState();
    const blob = new Blob([JSON.stringify({ _type: 'analogplotter_color', version: 1, ...s }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = ((s.negName || 'color') + ' to ' + (s.prtName || 'print')).replace(/[^\w.-]+/g, '_') + '.json';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('importFile').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try {
        const data = JSON.parse(await f.text());
        if (!data || data._type !== 'analogplotter_color') throw new Error('not a colour file');
        writeState(migrate(data)); render();
    } catch (err) {
        $('warnings').innerHTML = `<div class="warn">This file could not be read as an Analogplotter Color session (${esc(err.message)}).</div>`;
    }
});

let saved = null;
try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}
writeState(saved && typeof saved === 'object' ? { ...EXAMPLE, ...migrate(saved) } : EXAMPLE);
upgradeTips();
render();
</script>
</body>
</html>
